<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเรียงหน้า เรียงวัย</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        .game-container {
            width: 95%;
            max-width: 1000px;
            margin: 0 auto; 
            text-align: center;
            background: #fff;
            padding: 15px; 
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-top: 0; 
            margin-bottom: 20px;
            font-family: 'Kanit', sans-serif; 
            font-weight: 700;
            font-size: 1.8rem; 
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 25px; 
        }

        @media (min-width: 768px) {
            .game-container {
                padding: 25px; 
            }
            h1 {
                font-size: 2.5rem; 
            }
            .image-grid {
                grid-template-columns: repeat(6, 1fr); 
                gap: 15px; 
                margin-bottom: 30px;
            }
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-item img {
            width: 100%;
            height: auto; 
            aspect-ratio: 1 / 1; 
            min-height: 80px;
            background-color: #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            object-fit: cover; 
        }

        /* === [ นี่คือส่วนที่แก้ไขสี ] === */
        .number-selector {
            width: 44px;
            height: 44px;
            background-color: #eeeeee; /* เปลี่ยนเป็นสีเทาอ่อน */
            border-radius: 50%;
            border: 2px solid #cccccc; /* เปลี่ยนเป็นขอบสีเทา */
            margin-top: 10px;
            
            /* Sytling ตัวอักษร */
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            font-size: 1.2em;
            color: #757575; 
            text-align: center; 
            text-align-last: center; 
            
            /* ลบหน้าตาเริ่มต้นของ <select> */
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            
            cursor: pointer;
            padding: 0; 
        }

        /* เมื่อเลือกตัวเลขแล้ว ให้เปลี่ยนเป็นสีดำ */
        .number-selector.selected {
            color: #000;
        }

        .number-selector:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2); /* เปลี่ยนเงาตอน focus เป็นสีเทา */
        }
        /* === [ จบส่วนแก้ไขสี ] === */


       
    </style>
</head>
<body>

    <div class="game-container">
        <h1>GAME เรียงหน้า เรียงวัย</h1>

        <div class="image-grid">
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo12d120c26263ce8c3.jpg" alt="บุคคลที่ 1" onerror="this.src='https://via.placeholder.com/150x150?text=Person+1'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo2bfba1e0c854d3f3b.jpg" alt="บุคคลที่ 2" onerror="this.src='https://via.placeholder.com/150x150?text=Person+2'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo3460476902eba9cc4.jpg" alt="บุคคลที่ 3" onerror="this.src='https://via.placeholder.com/150x150?text=Person+3'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo4e76c6f2d4a05655f.jpg" alt="บุคคลที่ 4" onerror="this.src='https://via.placeholder.com/150x150?text=Person+4'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo5239ba1114e96b31d.jpg" alt="บุคคลที่ 5" onerror="this.src='https://via.placeholder.com/150x150?text=Person+5'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo6fb6a315fde9d619c.jpg" alt="บุคคลที่ 6" onerror="this.src='https://via.placeholder.com/150x150?text=Person+6'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo7d6b25368636baa2d.jpg" alt="บุคคลที่ 7" onerror="this.src='https://via.placeholder.com/150x150?text=Person+7'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo8559ea9059a1d65f6.jpg" alt="บุคคลที่ 8" onerror="this.src='https://via.placeholder.com/150x150?text=Person+8'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo95602af9b71189d85.jpg" alt="บุคคลที่ 9" onerror="this.src='https://via.placeholder.com/150x150?text=Person+9'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo10a127ca179f7fd6d3.jpg" alt="บุคคลที่ 10" onerror="this.src='https://via.placeholder.com/150x150?text=Person+10'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo11ca6cff3dd6ba8eb1.jpg" alt="บุคคลที่ 11" onerror="this.src='https://via.placeholder.com/150x150?text=Person+11'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
            <div class="grid-item">
                <img src="https://s.imgz.io/2025/11/06/Photo12a0c7d247c4220f3f.jpg" alt="บุคคลที่ 12" onerror="this.src='https://via.placeholder.com/150x150?text=Person+12'; this.onerror=null;">
                <select class="number-selector"></select>
            </div>
        </div>

    </div>
    
  
    </script>
</body>
</html>
