<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signature Strengths Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        /* --- Zen Theme: Mobile-First Styles --- */
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8f9fa;
            color: #555;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px 10px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            border: 1px solid #e9ecef;
            box-sizing: border-box;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #343a40;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 1.6em;
            line-height: 1.3;
        }

        /* --- Start Page --- */
        #start-container .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 120px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            font-size: 1em;
            font-family: 'Kanit', sans-serif;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #4682B4;
            box-shadow: 0 0 0 3px rgba(70, 130, 180, 0.2);
        }

        /* --- Question Styling --- */
        .question-block {
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.25em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.4;
            text-align: center;
        }

        /* --- Clickable Choices --- */
        .options .option-item {
            display: block;
            position: relative;
            margin-bottom: 15px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .options .option-label {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            transition: all 0.2s ease;
            border: 2px solid #dee2e6;
            font-size: 1.05em;
            line-height: 1.4;
            color: #495057;
            min-height: 80px;
        }
        .options .option-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .options .option-item input[type="radio"]:checked + .option-label {
            background-color: #eef7f6;
            border: 2px solid #4682B4;
            color: #4682B4;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(70, 130, 180, 0.15);
            transform: scale(1.02);
        }

        /* --- Unified Buttons --- */
        .main-btn {
            width: 100%;
            display: block;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background-color: #4682B4;
            color: white;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(70, 130, 180, 0.2);
            text-align: center;
        }
        .main-btn:active {
            transform: translateY(2px);
        }
        .main-btn:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .navigation-area {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* จัดเรียงปุ่มใหม่แก้ปัญหาปุ่มทับซ้อน */
        .nav-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        #prev-btn {
            flex: 1; /* แบ่งพื้นที่ 1 ส่วน */
            background-color: #e9ecef;
            color: #495057;
            box-shadow: none;
            padding: 12px;
            font-size: 1em;
        }
        #next-btn {
            flex: 2; /* แบ่งพื้นที่ 2 ส่วน (ใหญ่กว่าปุ่มย้อนกลับ) */
            padding: 12px;
        }
        
        #submit-btn {
            background-color: #28a745;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }
        
        /* Progress Indicator */
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #4682B4;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* --- Report Styles (Mobile) --- */
        .report-header {
            text-align: center;
            padding: 30px 20px;
            border-radius: 20px 20px 0 0;
            color: white;
            margin: -30px -20px 20px -20px;
        }
        .report-header img {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            padding: 10px;
            margin-bottom: 15px;
        }
        .report-content {
            padding: 10px 5px;
        }
        .top5-list {
            padding-left: 20px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .top5-list li {
            margin-bottom: 8px;
            color: #495057;
        }
    </style>
</head>
<body>

    <!-- หน้าเริ่ม -->
    <div id="start-container" class="container fade-in">
        <img src="https://s.imgz.io/2025/09/08/6naturestrengths14844cf9269afbf6.png" alt="Signature Strengths Logo" class="logo">
        <h1>Signature Strengths Assessment</h1>
        <div class="form-group">
            <label for="employeeName">ชื่อ-นามสกุล</label>
            <input type="text" id="employeeName" placeholder="กรอกชื่อ-นามสกุลของคุณ">
        </div>
        <div class="form-group">
            <label for="employeeId">รหัสพนักงาน</label>
            <input type="text" id="employeeId" placeholder="กรอกรหัสพนักงาน">
        </div>
        <div class="form-group">
            <label for="employeeEmail">อีเมล</label>
            <input type="email" id="employeeEmail" placeholder="กรอกอีเมลของท่าน">
        </div>
        <button id="start-btn" class="main-btn">เริ่มทำแบบทดสอบ</button>
    </div>

    <!-- หน้าทำแบบทดสอบ -->
    <div id="quiz-container" class="container" style="display: none;">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        
        <div id="questions-wrapper"></div>
        
        <div class="navigation-area">
            <div class="nav-row" id="nav-row-buttons">
                <button id="prev-btn" class="main-btn">ย้อนกลับ</button>
                <button id="next-btn" class="main-btn">ถัดไป</button>
            </div>
            <button id="submit-btn" class="main-btn" style="display: none;">ส่งคำตอบ</button>
        </div>
    </div>

    <!-- หน้าแสดงผลลัพธ์ -->
    <div id="results-container" class="container fade-in" style="display: none;">
        <!-- จะถูกสร้างด้วย JavaScript -->
    </div>

    <!-- Firebase SDK และ Script ทั้งหมดถูกรวมไว้ใน Module เดียว -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        // นำเข้า SweetAlert2
        import Swal from 'https://cdn.jsdelivr.net/npm/sweetalert2@11/src/sweetalert2.js';

        // *** ใส่ Firebase Config ของคุณตรงนี้ ***
const firebaseConfig = {
  apiKey: "AIzaSyCt1sthAka7e96OOv7y0IKnlip3pilA-00",
  authDomain: "st90-eef97.firebaseapp.com",
  projectId: "st90-eef97",
  storageBucket: "st90-eef97.firebasestorage.app",
  messagingSenderId: "381519034066",
  appId: "1:381519034066:web:16e5e46300be11bbe4df0b",
  measurementId: "G-RSF17XFT0L"
};
        // **********************************

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch(e) {
            console.warn("Firebase config is missing or invalid. Will mock data submission.");
        }

        const submitDataToFirebase = async function(payload) {
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                payload.timestamp = new Date();
                
                if (db && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                    await addDoc(collection(db, "assessments"), payload);
                } else {
                    console.log("Mocking DB Save:", payload);
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                Swal.fire({
                    title: 'บันทึกสำเร็จ!',
                    text: 'ข้อมูลของคุณถูกส่งเข้าระบบเรียบร้อยแล้ว',
                    icon: 'success',
                    confirmButtonText: 'ดูรายงานผลลัพธ์',
                }).then(() => {
                    showReportUI(payload);
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'การบันทึกข้อมูลล้มเหลว: ' + error.message,
                });
            }
        };

        // --- ข้อมูล 90 ข้อ ---

        const reportGroupStyles = {

            "พลังแห่งการขับเคลื่อน (Driving Power)": { backgroundColor: "#dc3545", textColor: "white", iconUrl: "https://s.imgz.io/2025/09/18/Drivingd1af403aa952dea6.png", definition: "คือพลังที่เปลี่ยนวิสัยทัศน์ให้กลายเป็นความจริง มันคือแรงขับเคลื่อนที่ไม่เคยหยุดนิ่งซึ่งถามว่า 'เราจะทำให้มันเกิดขึ้นได้อย่างไร และเมื่อไหร่?' พลังนี้เปรียบเสมือน 'เครื่องยนต์' ที่ทรงพลังซึ่งแปลงแผนการที่สวยหรูให้กลายเป็นผลลัพธ์ที่จับต้องได้ มันคือการลงมือทำ, การจัดการอย่างมีประสิทธิภาพ, และความมุ่งมั่นที่จะผลักดันงานให้สำเร็จลุล่วง" },

            "พลังแห่งการยืนหยัด (Resilient Power)": { backgroundColor: "#28a745", textColor: "white", iconUrl: "https://s.imgz.io/2025/09/16/Resilientbd6db9760d1fb358.png", definition: "คือพลังที่แสดงศักยภาพสูงสุดในยามวิกฤต มันคือคำตอบของคำถามที่ว่า 'เมื่อเราล้มลง เราจะลุกขึ้นสู้อย่างไร?' พลังนี้เปรียบเสมือน 'ต้นหลิว' ที่สามารถโอนอ่อนผ่อนตามพายุแต่ไม่เคยหักโค่น มันคือความสามารถในการปรับตัว, การฟื้นตัวจากความล้มเหลว, และการรักษาความสงบภายใต้แรงกดดัน เพื่อให้องค์กรสามารถผ่านพ้นทุกอุปสรรคและกลับมาแข็งแกร่งกว่าเดิม" }
        };

        const QUESTIONS_PER_PAGE = 1; 
        let currentPage = 0;
        const totalPages = Math.ceil(questions.length / QUESTIONS_PER_PAGE);
        const userAnswers = new Array(questions.length).fill(null);
        let employeeName = '', employeeId = '', employeeEmail = '';
        
        const startContainer = document.getElementById('start-container');
        const quizContainer = document.getElementById('quiz-container');
        const questionsWrapper = document.getElementById('questions-wrapper');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const progressBar = document.getElementById('progress-bar');
        const navRowButtons = document.getElementById('nav-row-buttons');
        const startBtn = document.getElementById('start-btn');
        
        // ฟังก์ชันสำหรับหน้า Report 
// ฟังก์ชันสำหรับหน้า Report (ปรับปรุงให้กระชับขึ้นและเอาปุ่มทำใหม่ออก)
        const showReportUI = function(data) {
            quizContainer.style.display = 'none';
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.style.display = 'block';
            
            const style = reportGroupStyles[data.dominantGroup] || { backgroundColor: "#ccc", textColor: "black", iconUrl: "", definition: "" };

            resultsContainer.innerHTML = `
                <div class="report-header" style="background-color: ${style.backgroundColor}; color: ${style.textColor};">
                    <img src="${style.iconUrl}" alt="Icon">
                    <h4 style="margin:0 0 10px 0; font-weight:normal; font-size: 1.1em;">กลุ่มพลังที่โดดเด่นที่สุดของคุณ</h4>
                    <h1 style="margin:0; font-size: 1.8em; color: inherit;">${data.dominantGroup}</h1>
                </div>
                
                <div class="report-content">
                    <p style="font-size: 1.1em; line-height: 1.6; margin-bottom: 25px; text-align: left; color: #495057;">
                        ${style.definition}
                    </p>
                    
                    <h3 style="color: #343a40; margin-bottom: 15px; border-bottom: 2px solid #e9ecef; padding-bottom: 5px;">5 จุดแข็งที่โดดเด่น</h3>
                    <ol class="top5-list" style="text-align: left; margin-bottom: 20px;">
                        ${data.top5.map(strength => `<li><strong style="color: #4682B4;">${strength}</strong></li>`).join('')}
                    </ol>
                    
                    <!-- ย้ายชื่อและรหัสมาไว้บรรทัดเดียวกัน และตัดปุ่มออก -->
                    <div style="padding-top: 15px; border-top: 1px dashed #ced4da; text-align: center; color: #888; font-size: 0.95em;">
                        <strong>ชื่อ:</strong> ${data.employeeName} &nbsp;|&nbsp; <strong>รหัส:</strong> ${data.employeeId}
                    </div>
                </div>
            `;
        };
        
        function saveAnswers() {
            const block = document.querySelector('.question-block');
            if(block) {
                const questionIndex = parseInt(block.dataset.index);
                const selectedOption = block.querySelector('input[type="radio"]:checked');
                if (selectedOption) {
                    userAnswers[questionIndex] = selectedOption.value;
                }
            }
        }

        function renderPage() {
            questionsWrapper.innerHTML = '';
            const questionIndex = currentPage;
            const q = questions[questionIndex];
            
            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            questionBlock.dataset.index = questionIndex;
            
            const answerA = userAnswers[questionIndex] === 'A' ? 'checked' : '';
            const answerB = userAnswers[questionIndex] === 'B' ? 'checked' : '';
            
            // นำตัวเลขข้อออกจากใต้คำถาม เปลี่ยนไปแสดงด้านบนปุ่มแทน
            questionBlock.innerHTML = `
                <div class="question-text">โปรดเลือกข้อที่ตรงกับคุณที่สุด</div>
                <div class="options">
                    <label class="option-item">
                        <input type="radio" name="q${questionIndex}" value="A" ${answerA}>
                        <span class="option-label">${q.clean_option_a}</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="q${questionIndex}" value="B" ${answerB}>
                        <span class="option-label">${q.clean_option_b}</span>
                    </label>
                </div>
            `;
            
            // แสดงจำนวนข้อที่มุมขวาบนเล็กๆ แทนเพื่อความสวยงาม
            const progressText = document.createElement('div');
            progressText.style.textAlign = 'right';
            progressText.style.color = '#adb5bd';
            progressText.style.fontSize = '0.9em';
            progressText.style.marginBottom = '15px';
            progressText.style.fontWeight = 'bold';
            progressText.innerText = `ข้อ ${q.question_number} จาก ${questions.length}`;
            
            questionsWrapper.appendChild(progressText);
            questionsWrapper.appendChild(questionBlock);
            
            updateNavigation();
            attachAutoAdvance(); 
        }

        function attachAutoAdvance() {
            const radios = document.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    saveAnswers();
                    // เปลี่ยนหน้าทันที
                    if (currentPage < totalPages - 1) {
                        currentPage++;
                        renderPage();
                    } else {
                        updateNavigation();
                    }
                });
            });
        }

        function updateNavigation() {
            const progressPercent = ((currentPage + 1) / totalPages) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            prevBtn.disabled = currentPage === 0;

            if (currentPage === totalPages - 1) {
                navRowButtons.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                navRowButtons.style.display = 'flex';
                submitBtn.style.display = 'none';
            }
        }

        function calculateAndShowResults() {
            const firstMissingIndex = userAnswers.indexOf(null);
            
            if (firstMissingIndex !== -1) {
                currentPage = firstMissingIndex;
                renderPage();
                Swal.fire({ icon: 'warning', title: 'ยังตอบไม่ครบ', text: `กรุณาตอบให้ครบถ้วน (ย้อนกลับมาที่ข้อ ${firstMissingIndex + 1})` });
                return;
            }

            const strengthCounts = {};
            for(let i=1; i<=30; i++) {
                strengthCounts['S' + String(i).padStart(2, '0')] = 0;
            }

            userAnswers.forEach((answer, index) => {
                const q = questions[index];
                if (answer === 'A') {
                    strengthCounts[q.strength_code_a] += 5;
                    strengthCounts[q.strength_code_b] += 1;
                } else if (answer === 'B') {
                    strengthCounts[q.strength_code_b] += 5;
                    strengthCounts[q.strength_code_a] += 1;
                }
            });

            // ใช้ชื่อ Group แบบเต็มตามต้นฉบับ
            const groupTotalScores = {
                "พลังแห่งวิสัยทัศน์ (Visionary Power)": 0, "พลังแห่งการสร้างสรรค์ (Creative Power)": 0,
                "พลังแห่งการขับเคลื่อน (Driving Power)": 0, "พลังแห่งการเชื่อมโยง (Connecting Power)": 0,
                "พลังแห่งคุณธรรม (Integrity Power)": 0, "พลังแห่งการยืนหยัด (Resilient Power)": 0
            };

            for (const code in strengthCounts) {
                const group = strengthToGroupMap[code];
                if (group) groupTotalScores[group] += strengthCounts[code];
            }

            const sortedGroups = Object.entries(groupTotalScores).sort(([, a], [, b]) => b - a);
            const dominantGroup = sortedGroups[0][0];

            // เพิ่มรหัสพลังในวงเล็บต่อท้าย (เช่น (S07))
            const sortedStrengths = Object.entries(strengthCounts).sort(([, a], [, b]) => b - a);
            const top5Strengths = sortedStrengths.slice(0, 5).map(([code,]) => `${definitions[code]} (${code})`);
            
            const submissionData = {
                employeeId: employeeId,
                employeeName: employeeName,
                email: employeeEmail,
                dominantGroup: dominantGroup,
                top5: top5Strengths,
                strengthCounts: strengthCounts,
                groupTotalScores: groupTotalScores
            };
            
            submitDataToFirebase(submissionData);
        }

        startBtn.addEventListener('click', () => {
            const nameInput = document.getElementById('employeeName').value.trim();
            const idInput = document.getElementById('employeeId').value.trim();
            const emailInput = document.getElementById('employeeEmail').value.trim();
            
            if (!nameInput || !idInput || !emailInput) {
                Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอกข้อมูลให้ครบทุกช่อง' });
                return;
            }
            
            employeeName = nameInput; employeeId = idInput; employeeEmail = emailInput;
            startContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            renderPage();
        });

        prevBtn.addEventListener('click', () => {
            saveAnswers();
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener('click', () => {
            saveAnswers();
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
            } else if (currentPage === totalPages - 1 && userAnswers[currentPage] === null) {
                Swal.fire({ icon: 'warning', title: 'เลือกคำตอบก่อน', text: 'กรุณาเลือกคำตอบเพื่อไปยังหน้าถัดไป หรือส่งคำตอบ' });
            }
        });

        submitBtn.addEventListener('click', () => {
            saveAnswers();
            calculateAndShowResults();
        });
    </script>
</body>
</html>
